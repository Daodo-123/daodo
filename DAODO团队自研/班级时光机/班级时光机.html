<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>班级时光机 · v3.2</title>

    <!-- Logo Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='f' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2381C9FF'/%3E%3Cstop offset='100%25' stop-color='%23A78BFA'/%3E%3C/linearGradient%3E%3Cfilter id='g'%3E%3CfeGaussianBlur stdDeviation='2' result='b'/%3E%3CfeMerge%3E%3CfeMergeNode in='b'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Crect x='0' y='0' width='200' height='200' rx='40' fill='%230b0d10'/%3E%3Crect x='10' y='10' width='180' height='180' rx='40' fill='rgba(255,255,255,0.04)' stroke='rgba(255,255,255,0.06)' stroke-width='2'/%3E%3Cpath d='M 42 70 L 26 100 L 42 130' fill='none' stroke='%2381C9FF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' opacity='0.7'/%3E%3Cpath d='M 62 78 Q 82 58 100 78 Q 118 58 138 78 L 138 122 Q 118 102 100 122 Q 82 102 62 122 Z' fill='rgba(255,255,255,0.06)' stroke='url(%23f)' stroke-width='2.5' filter='url(%23g)'/%3E%3Cline x1='100' y1='65' x2='100' y2='135' stroke='rgba(255,255,255,0.15)' stroke-width='2'/%3E%3Ccircle cx='100' cy='100' r='22' fill='none' stroke='url(%23f)' stroke-width='2.5'/%3E%3Cline x1='100' y1='100' x2='100' y2='84' stroke='url(%23f)' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='100' y1='100' x2='114' y2='106' stroke='url(%23f)' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='100' cy='100' r='3' fill='url(%23f)'/%3E%3Cpath d='M 158 70 L 174 100 L 158 130' fill='none' stroke='%2381C9FF' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' opacity='0.7'/%3E%3Ccircle cx='174' cy='168' r='5' fill='%23A78BFA' opacity='0.5'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

    <!-- ===== 全局背景 ===== -->
    <div class="bg-glow" id="bgGlow"></div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <!-- ================================================================
         认证页
         ================================================================ -->
    <div class="auth-wrap" id="authWrap">
            <div id="particles"></div>
        <div class="auth-card">
            <div class="auth-logo">
                <svg viewBox="0 0 200 200" width="48" height="48"><use href="#logo-svg"></use></svg>
                <span>班级时光机 · <span class="gold">登录</span></span>
            </div>
            <div id="loginBox">
                <h2>登录</h2>
                <div class="form-item"><label>邮箱</label><input type="email" id="loginEmail" placeholder="输入注册邮箱" /></div>
                <div class="form-item"><label>密码</label><input type="password" id="loginPwd" placeholder="输入密码" /></div>
                <div class="checkbox-row">
                    <label><input type="checkbox" id="autoLoginCheck" /> 自动登录</label>
                    <label><input type="checkbox" id="rememberPwdCheck" /> 记住密码</label>
                </div>
                <button class="btn-main" id="loginBtn">登录</button>
                <div class="switch-text"><span id="toReg">没有账号？去注册</span><br /><span id="toFindPwd">忘记密码？</span></div>
            </div>
            <div id="regBox" class="hidden">
                <h2>注册账号</h2>
                <div class="form-item"><label>用户名（0~15位）</label><input id="regName" placeholder="0~15位字符" /></div>
                <div class="form-item"><label>邮箱</label><input id="regEmail" placeholder="任意邮箱格式" /></div>
                <div class="form-item"><label>密码（6~20位）</label><input type="password" id="regPwd" /></div>
                <div class="form-item"><label>确认密码</label><input type="password" id="regPwd2" /></div>
                <button class="btn-main" id="regBtn">注册</button>
                <div class="switch-text"><span id="toLogin">已有账号？去登录</span></div>
            </div>
            <div id="findPwdBox" class="hidden">
                <h2>找回密码</h2>
                <div class="form-item"><label>注册邮箱</label><input id="findEmail" /></div>
                <button class="btn-main" id="findBtn">查询密码</button>
                <div class="switch-text"><span id="backLogin">返回登录</span></div>
            </div>
        </div>
    </div>

    <!-- ================================================================
         主界面
         ================================================================ -->
    <div class="main-wrap" id="mainWrap">

        <!-- 顶部导航 -->
        <header class="top-nav" id="topNav">
            <div class="top-nav-inner">
                <div class="top-nav-left" id="homeTopLeft">
                    <svg viewBox="0 0 200 200" width="28" height="28" class="nav-logo"><use href="#logo-svg"></use></svg>
                    <span class="nav-title" id="homeNavTitle">班级时光机</span>
                </div>
                <div class="top-nav-left hidden" id="classTopLeft">
                    <button class="nav-back" id="navBackBtn"><i class="fa fa-arrow-left"></i></button>
                    <span class="nav-title" id="classNavTitle">班级空间</span>
                </div>
                <div class="top-nav-right">
                    <button class="nav-btn" id="navUserBtn" title="个人中心"><i class="fa fa-user"></i></button>
                    <button class="nav-btn" id="navSettingsBtn" title="设置"><i class="fa fa-gear"></i></button>
                </div>
            </div>
        </header>

        <!-- 视图容器 -->
        <div class="view-container" id="viewContainer">

            <!-- 主主页 -->
            <div class="view active" id="view-home">
                <div class="view-content">
                    <div class="panel">
                        <h3>📚 我的班级 <span class="class-count" id="classCount"></span></h3>
                        <div id="myClassList" class="class-grid"></div>
                        <div class="action-row">
                            <button class="btn-main" id="createClassBtn">➕ 创建班级</button>
                            <button class="btn-outline" id="joinClassBtn">🔍 加入班级</button>
                        </div>
                    </div>
                    <div class="panel">
                        <h3>📢 平台公告</h3>
                        <div id="platformAnnouncement" class="announcement-text">欢迎来到班级时光机！在这里记录你的成长足迹 🎓</div>
                    </div>
                </div>
            </div>

            <!-- 副主页 -->
            <div class="view" id="view-class">
                <div class="view-content">
                    <div id="classSpaceContent"></div>
                </div>
            </div>

            <!-- 个人中心（独立视图） -->
            <div class="view" id="view-profile">
                <div class="view-content">
                    <div id="profileContent"></div>
                </div>
            </div>

            <!-- 设置（独立视图） -->
            <div class="view" id="view-settings">
                <div class="view-content">
                    <div id="settingsContent"></div>
                </div>
            </div>

        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav" id="bottomNav">
            <div class="nav-items" id="navMainItems">
                <button class="nav-item active" data-tab="home"><i class="fa fa-home"></i><span>主页</span></button>
                <button class="nav-item" data-tab="myclasses"><i class="fa fa-book"></i><span>班级</span></button>
                <button class="nav-item" data-tab="searchclass"><i class="fa fa-search"></i><span>搜索</span></button>
                <button class="nav-item" data-tab="profile"><i class="fa fa-user"></i><span>我的</span></button>
                <button class="nav-item" data-tab="settings"><i class="fa fa-gear"></i><span>设置</span></button>
            </div>
            <div class="nav-items hidden" id="navClassItems">
                <button class="nav-item active" data-tab="dynamic"><i class="fa fa-rss"></i><span>动态</span></button>
                <button class="nav-item" data-tab="messages"><i class="fa fa-comments"></i><span>消息</span></button>
                <button class="nav-item" data-tab="notice"><i class="fa fa-bullhorn"></i><span>通知</span></button>
                <button class="nav-item" data-tab="functions"><i class="fa fa-cubes"></i><span>功能</span></button>
                <button class="nav-item" data-tab="more" id="moreBtn"><i class="fa fa-ellipsis-h"></i><span>更多</span></button>
            </div>
        </nav>

        <!-- 更多抽屉 -->
        <div class="drawer-overlay" id="drawerOverlay">
            <div class="drawer" id="drawer">
                <div class="drawer-header"><span>更多功能</span><button class="drawer-close" id="drawerClose"><i class="fa fa-times"></i></button></div>
                <div class="drawer-grid">
                    <button class="drawer-item" data-tab="capsule"><i class="fa fa-clock-o"></i>时间胶囊</button>
                    <button class="drawer-item" data-tab="timeline"><i class="fa fa-history"></i>大事记</button>
                    <button class="drawer-item" data-tab="destinations"><i class="fa fa-map-marker"></i>去向登记</button>
                    <button class="drawer-item" data-tab="teacher"><i class="fa fa-graduation-cap"></i>教师寄语</button>
                    <button class="drawer-item" data-tab="myLike"><i class="fa fa-heart"></i>我的点赞</button>
                    <button class="drawer-item" data-tab="myCollect"><i class="fa fa-bookmark"></i>我的收藏</button>
                    <button class="drawer-item" data-tab="treehole"><i class="fa fa-tree"></i>匿名树洞</button>
                    <button class="drawer-item" data-tab="admin" id="drawerAdmin" style="display:none;"><i class="fa fa-shield"></i>管理后台</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ================================================================
         模态框（所有弹窗）
         ================================================================ -->
    <!-- 创建班级 -->
    <div class="modal-mask" id="createClassModal">
        <div class="modal">
            <h3>创建班级</h3>
            <div class="form-item"><label>班级名称</label><input id="createClassName" placeholder="如：2024届20班" /></div>
            <div class="form-item"><label>学校名称</label><input id="createSchoolName" placeholder="你的学校" /></div>
            <div class="form-item"><label>年级</label><select id="createGrade"><option value="初三">初三</option><option value="高一">高一</option><option value="高二">高二</option><option value="高三">高三</option><option value="大一">大一</option><option value="大二">大二</option><option value="大三">大三</option><option value="大四">大四</option></select></div>
            <div class="form-item"><label>毕业年份</label><input type="number" id="createGraduationYear" placeholder="2024" /></div>
            <div class="form-item"><label><input type="checkbox" id="createIsPublic" checked /> 公开班级</label></div>
            <div class="modal-btns"><button class="btn-cancel" id="createClassCancel">取消</button><button class="btn-save" id="createClassConfirm">创建</button></div>
        </div>
    </div>

    <!-- 加入班级（含搜索框） -->
    <div class="modal-mask" id="joinClassModal">
        <div class="modal">
            <h3>🔍 加入班级</h3>
            <div class="form-item"><label>搜索班级名称</label><input id="joinClassSearch" placeholder="输入班级名称..." /></div>
            <div id="joinClassResults" style="max-height:200px;overflow-y:auto;"></div>
            <div class="form-item" style="margin-top:12px;"><label>或输入邀请码</label><input id="joinClassInviteCode" placeholder="输入邀请码" /></div>
            <div class="modal-btns"><button class="btn-cancel" id="joinClassCancel">取消</button><button class="btn-save" id="joinClassConfirm">加入</button></div>
        </div>
    </div>

    <!-- 时间胶囊 -->
    <div class="modal-mask" id="writeCapsuleModal">
        <div class="modal">
            <h3>✉️ 写一封时间胶囊</h3>
            <div class="form-item"><label>写给谁</label><input id="capsuleTo" placeholder="写给未来的自己 / 某位同学 / 全班" /></div>
            <div class="form-item"><label>内容</label><textarea id="capsuleContent" rows="5" placeholder="写下你想对TA说的话..."></textarea></div>
            <div class="form-item"><label>解锁日期</label><input type="date" id="capsuleUnlockDate" /></div>
            <div class="modal-btns"><button class="btn-cancel" id="writeCapsuleCancel">取消</button><button class="btn-save" id="writeCapsuleConfirm">封存 💌</button></div>
        </div>
    </div>

    <!-- 大事记 -->
    <div class="modal-mask" id="addTimelineModal">
        <div class="modal">
            <h3>📜 添加大事记</h3>
            <div class="form-item"><label>事件标题</label><input id="timelineTitle" placeholder="如：军训、运动会" /></div>
            <div class="form-item"><label>描述</label><textarea id="timelineDesc" rows="3" placeholder="简单描述..."></textarea></div>
            <div class="form-item"><label>日期</label><input type="date" id="timelineDate" /></div>
            <div class="modal-btns"><button class="btn-cancel" id="addTimelineCancel">取消</button><button class="btn-save" id="addTimelineConfirm">添加</button></div>
        </div>
    </div>

    <!-- 去向登记 -->
    <div class="modal-mask" id="addDestinationModal">
        <div class="modal">
            <h3>📝 登记我的去向</h3>
            <div class="form-item"><label>学校名称</label><input id="destSchool" placeholder="即将就读的高中/大学" /></div>
            <div class="form-item"><label>专业/班级</label><input id="destMajor" placeholder="专业或班级" /></div>
            <div class="form-item"><label>城市</label><input id="destCity" placeholder="所在城市" /></div>
            <div class="form-item"><label><input type="checkbox" id="destIsHighSchool" checked /> 高中去向</label></div>
            <div class="modal-btns"><button class="btn-cancel" id="addDestinationCancel">取消</button><button class="btn-save" id="addDestinationConfirm">保存</button></div>
        </div>
    </div>

    <!-- 通知 -->
    <div class="modal-mask" id="newNoticeModal">
        <div class="modal">
            <h3>发布通知</h3>
            <div class="form-item"><label>标题</label><input id="noticeTitleInput" /></div>
            <div class="form-item"><label>内容</label><textarea id="noticeDescInput" rows="4"></textarea></div>
            <div class="form-item"><label>截止日期</label><input type="datetime-local" id="noticeDeadlineInput" /></div>
            <div class="modal-btns"><button class="btn-cancel" id="noticeModalCancel">取消</button><button class="btn-save" id="noticeModalConfirm">发布</button></div>
        </div>
    </div>

    <!-- 投票 -->
    <div class="modal-mask" id="newPollModal">
        <div class="modal">
            <h3>发起投票</h3>
            <div class="form-item"><label>问题</label><input id="pollQuestionInput" /></div>
            <div class="form-item"><label>选项（每行一个）</label><textarea id="pollOptionsInput" rows="4" placeholder="选项1&#10;选项2&#10;选项3"></textarea></div>
            <div class="form-item"><label><input type="checkbox" id="pollAnonymousCheck" /> 匿名投票</label></div>
            <div class="modal-btns"><button class="btn-cancel" id="pollModalCancel">取消</button><button class="btn-save" id="pollModalConfirm">发起</button></div>
        </div>
    </div>

    <!-- 日历事件 -->
    <div class="modal-mask" id="addEventModal">
        <div class="modal">
            <h3>添加班级事件</h3>
            <div class="form-item"><label>标题</label><input id="eventTitleInput" /></div>
            <div class="form-item"><label>描述</label><textarea id="eventDescInput" rows="3"></textarea></div>
            <div class="form-item"><label>日期</label><input type="date" id="eventDateInput" /></div>
            <div class="form-item"><label>类型</label><select id="eventTypeInput"><option value="考试">考试</option><option value="活动">活动</option><option value="生日">生日</option><option value="提醒">提醒</option></select></div>
            <div class="modal-btns"><button class="btn-cancel" id="eventModalCancel">取消</button><button class="btn-save" id="eventModalConfirm">添加</button></div>
        </div>
    </div>

    <!-- 签到 -->
    <div class="modal-mask" id="checkinModal">
        <div class="modal" style="max-width:380px;"><div id="checkinContent"></div></div>
    </div>

    <!-- 图片查看器 -->
    <div class="modal-mask" id="imageViewer">
        <div class="modal" style="max-width:90vw;max-height:90vh;padding:0;background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;position:relative;">
            <img id="imageViewerSrc" style="max-width:90vw;max-height:85vh;border-radius:var(--radius-sm);object-fit:contain;background:rgba(0,0,0,0.4);cursor:zoom-out;" />
            <span style="position:absolute;top:10px;right:20px;font-size:30px;color:#fff;cursor:pointer;opacity:0.7;" id="imageViewerClose">&times;</span>
        </div>
    </div>

    <!-- 表情面板 -->
    <div class="emoji-panel" id="globalEmojiPanel"></div>

    <!-- Logo 定义 -->
    <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#81C9FF" />
                <stop offset="100%" stop-color="#A78BFA" />
            </linearGradient>
            <filter id="bookGlow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <symbol id="logo-svg" viewBox="0 0 200 200">
            <rect x="0" y="0" width="200" height="200" rx="40" fill="#0b0d10"/>
            <rect x="10" y="10" width="180" height="180" rx="40" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
            <path d="M 42 70 L 26 100 L 42 130" fill="none" stroke="#81C9FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
            <path d="M 62 78 Q 82 58 100 78 Q 118 58 138 78 L 138 122 Q 118 102 100 122 Q 82 102 62 122 Z" fill="rgba(255,255,255,0.06)" stroke="url(#bookGrad)" stroke-width="2.5" filter="url(#bookGlow)"/>
            <line x1="100" y1="65" x2="100" y2="135" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
            <circle cx="100" cy="100" r="22" fill="none" stroke="url(#bookGrad)" stroke-width="2.5"/>
            <line x1="100" y1="100" x2="100" y2="84" stroke="url(#bookGrad)" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="100" y1="100" x2="114" y2="106" stroke="url(#bookGrad)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="100" cy="100" r="3" fill="url(#bookGrad)"/>
            <path d="M 158 70 L 174 100 L 158 130" fill="none" stroke="#81C9FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
            <circle cx="174" cy="168" r="5" fill="#A78BFA" opacity="0.5"/>
        </symbol>
    </svg>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
