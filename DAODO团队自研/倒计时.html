<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>倒计时器 · Daodo</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2381C9FF'/%3E%3Cstop offset='100%25' stop-color='%23A78BFA'/%3E%3C/linearGradient%3E%3Cfilter id='f'%3E%3CfeGaussianBlur stdDeviation='2' result='b'/%3E%3CfeMerge%3E%3CfeMergeNode in='b'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Crect x='0' y='0' width='200' height='200' rx='40' fill='%230b0d10'/%3E%3Crect x='10' y='10' width='180' height='180' rx='40' fill='rgba(255,255,255,0.04)' stroke='rgba(255,255,255,0.06)' stroke-width='2'/%3E%3Cpath d='M 45 72 L 28 100 L 45 128' fill='none' stroke='%2381C9FF' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' opacity='0.9'/%3E%3Ctext x='100' y='138' font-family='Inter, system-ui, sans-serif' font-size='104' font-weight='800' fill='url(%23g)' filter='url(%23f)' text-anchor='middle' letter-spacing='-2'%3ED%3C/text%3E%3Cpath d='M 155 72 L 172 100 L 155 128' fill='none' stroke='%2381C9FF' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' opacity='0.9'/%3E%3Ccircle cx='172' cy='165' r='6' fill='%23A78BFA' opacity='0.7'/%3E%3C/svg%3E">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b0d10;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(10, 30, 60, 0.8) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(60, 20, 80, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(0, 40, 70, 0.6) 0%, transparent 40%);
            color: #e8edf5;
            padding: 20px;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            padding: 44px 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-icon { width: 44px; height: 44px; }
        .logo-icon svg { width: 100%; height: 100%; display: block; }
        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #a0c4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-text .dot { color: #64b5f6; -webkit-text-fill-color: #64b5f6; }

        .config-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .config-panel label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
        }
        .config-panel input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 14px;
            color: #e8edf5;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            flex: 1;
            min-width: 120px;
        }
        .config-panel input:focus {
            border-color: rgba(129, 201, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        .config-panel input[type="date"] { flex: 0.8; min-width: 140px; }
        .config-panel input[type="text"] { flex: 1.2; min-width: 140px; }

        .btn {
            padding: 8px 22px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: #81C9FF;
            color: #0b0d10;
        }
        .btn:hover { transform: scale(1.04); box-shadow: 0 4px 20px rgba(129, 201, 255, 0.25); }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
        }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .btn-danger {
            background: rgba(244, 114, 182, 0.15);
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.1);
        }
        .btn-danger:hover { background: rgba(244, 114, 182, 0.25); }

        .preset-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .preset-btns .btn {
            font-size: 12px;
            padding: 5px 16px;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .preset-btns .btn:hover {
            background: rgba(129, 201, 255, 0.08);
            color: #81C9FF;
            border-color: rgba(129, 201, 255, 0.1);
        }

        .countdown-main {
            text-align: center;
            padding: 16px 0 8px;
        }

        .countdown-main .target-name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .countdown-main .target-name .highlight-gaokao { color: #FCD34D; }
        .countdown-main .target-name .highlight-zhongkao { color: #81C9FF; }
        .countdown-main .target-name .highlight-custom { color: #a78bfa; }

        .countdown-main .target-date {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 20px;
        }

        .countdown-main .big-number {
            font-size: 80px;
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1.1;
        }
        .countdown-main .big-number .unit {
            font-size: 24px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0;
        }

        .countdown-main .detail-time {
            font-size: 24px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 8px;
            font-variant-numeric: tabular-nums;
        }
        .countdown-main .detail-time .sep {
            color: rgba(255, 255, 255, 0.1);
            margin: 0 4px;
        }

        .countdown-main .status {
            margin-top: 16px;
            font-size: 14px;
            display: inline-block;
            padding: 4px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
        }
        .countdown-main .status.active {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.08);
            background: rgba(74, 222, 128, 0.04);
        }
        .countdown-main .status.over {
            color: #f472b6;
            border-color: rgba(244, 114, 182, 0.08);
            background: rgba(244, 114, 182, 0.04);
        }

        .countdown-main .progress-wrap {
            margin: 20px auto 0;
            max-width: 400px;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .countdown-main .progress-wrap .bar {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .countdown-main .progress-wrap .bar.color-gaokao { background: linear-gradient(90deg, #FCD34D, #f59e0b); }
        .countdown-main .progress-wrap .bar.color-zhongkao { background: linear-gradient(90deg, #81C9FF, #3b82f6); }
        .countdown-main .progress-wrap .bar.color-custom { background: linear-gradient(90deg, #a78bfa, #7c3aed); }

        .countdown-main .progress-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.12);
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: rgba(255, 255, 255, 0.2);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 15px; }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .footer .copy {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.12);
        }
        .footer .copy i { color: #f472b6; }
        .footer .badge {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            background: rgba(255,255,255,0.02);
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        @media (max-width: 640px) {
            .container { padding: 24px 16px; border-radius: 32px; }
            .config-panel { flex-direction: column; align-items: stretch; }
            .config-panel input { min-width: unset; }
            .countdown-main .big-number { font-size: 56px; }
            .countdown-main .detail-time { font-size: 18px; }
            .header { flex-direction: column; align-items: flex-start; }
            .preset-btns { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <div class="logo-group">
            <div class="logo-icon">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#81C9FF" />
                            <stop offset="100%" stop-color="#A78BFA" />
                        </linearGradient>
                        <filter id="f"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                    </defs>
                    <rect x="10" y="10" width="180" height="180" rx="40" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
                    <path d="M 45 72 L 28 100 L 45 128" fill="none" stroke="#81C9FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                    <text x="100" y="138" font-family="'Inter', system-ui, sans-serif" font-size="104" font-weight="800" fill="url(#g)" filter="url(#f)" text-anchor="middle" letter-spacing="-2">D</text>
                    <path d="M 155 72 L 172 100 L 155 128" fill="none" stroke="#81C9FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                    <circle cx="172" cy="165" r="6" fill="#A78BFA" opacity="0.7"/>
                </svg>
            </div>
            <span class="logo-text">Daodo<span class="dot">.</span></span>
        </div>
        <div style="font-size:13px;color:rgba(255,255,255,0.15);">⏳ 通用倒计时器</div>
    </div>

    <!-- 配置面板 -->
    <div class="config-panel">
        <div class="preset-btns">
            <button class="btn" data-preset="gaokao">🎓 高考</button>
            <button class="btn" data-preset="zhongkao">📚 中考</button>
            <button class="btn" data-preset="custom">✨ 自定义</button>
        </div>
        <label>名称</label>
        <input type="text" id="targetName" placeholder="如：高考、项目截止日..." value="中考" />
        <label>日期</label>
        <input type="date" id="targetDate" value="2027-06-14" />
        <button class="btn" id="startBtn">▶ 开始</button>
        <button class="btn btn-danger" id="resetBtn">✕ 清除</button>
    </div>

    <!-- 倒计时显示区 -->
    <div id="displayArea"></div>

    <!-- 页脚 -->
    <div class="footer">
        <div class="copy">© 2026 Daodo · Made with <i class="fas fa-heart"></i></div>
        <div class="badge" id="footerBadge">✨ 时间看得见</div>
    </div>
</div>

<script>
    // ================================================================
    //  🔧 预设日期（你只需要改这里）
    // ================================================================
    const PRESETS = {
        gaokao: { name: '高考', date: '2030-06-07' },
        zhongkao: { name: '中考', date: '2027-06-14' }
    };

    // ================================================================
    //  💬 励志语录（只抽一次，之后固定不变）
    // ================================================================
    const BADGES = [
        '✨ 时间看得见',
        '⏰ 珍惜每一秒',
        '🎯 专注当下',
        '💪 你可以的',
        '📈 每天进步一点点',
        '🚀 乾坤未定，你我皆是黑马',
        '🌱 种一棵树最好的时间是十年前，其次是现在'
    ];
    // 页面加载时抽一次，之后再也不变
    const FIXED_BADGE = BADGES[Math.floor(Math.random() * BADGES.length)];

    // ================================================================
    //  DOM 引用
    // ================================================================
    const targetName = document.getElementById('targetName');
    const targetDate = document.getElementById('targetDate');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const displayArea = document.getElementById('displayArea');
    const footerBadge = document.getElementById('footerBadge');

    // 把固定语录写进页脚
    footerBadge.textContent = FIXED_BADGE;

    let currentTarget = null;
    let timer = null;

    // ================================================================
    //  存储
    // ================================================================
    function loadFromStorage() {
        try {
            const saved = localStorage.getItem('daodo_countdown');
            if (saved) {
                const data = JSON.parse(saved);
                currentTarget = data;
                targetName.value = data.name;
                targetDate.value = data.date;
                renderCountdown();
                return true;
            }
        } catch (e) {}
        return false;
    }

    function saveToStorage() {
        if (currentTarget) {
            localStorage.setItem('daodo_countdown', JSON.stringify(currentTarget));
        }
    }

    // ================================================================
    //  渲染倒计时
    // ================================================================
    function renderCountdown() {
        if (!currentTarget || !currentTarget.date) {
            displayArea.innerHTML = `
                <div class="empty-state">
                    <div class="icon">⏳</div>
                    <p>设置一个目标，开始倒计时</p>
                    <p style="font-size:13px;color:rgba(255,255,255,0.1);">支持中考、高考、工作项目、纪念日……</p>
                </div>
            `;
            return;
        }

        const now = new Date();
        const target = new Date(currentTarget.date + 'T00:00:00');
        const diffMs = target.getTime() - now.getTime();

        let colorClass = 'color-custom';
        let highlightClass = 'highlight-custom';
        if (currentTarget.name === '高考') { colorClass = 'color-gaokao'; highlightClass = 'highlight-gaokao'; }
        else if (currentTarget.name === '中考') { colorClass = 'color-zhongkao'; highlightClass = 'highlight-zhongkao'; }

        let days, hours, minutes, seconds, statusText, statusClass, progress;
        const isOver = diffMs <= 0;

        if (isOver) {
            days = 0; hours = 0; minutes = 0; seconds = 0;
            statusText = '🎉 已完成！';
            statusClass = 'over';
            progress = 100;
        } else {
            const totalSec = Math.floor(diffMs / 1000);
            days = Math.floor(totalSec / 86400);
            hours = Math.floor((totalSec % 86400) / 3600);
            minutes = Math.floor((totalSec % 3600) / 60);
            seconds = totalSec % 60;

            if (days <= 3) {
                statusText = `🚀 冲刺模式！仅剩 ${days} 天！`;
                statusClass = 'active';
            } else {
                statusText = '⏳ 倒计时中';
                statusClass = 'active';
            }

            const startDate = new Date(target);
            startDate.setFullYear(startDate.getFullYear() - 1);
            const totalDuration = target.getTime() - startDate.getTime();
            const elapsed = now.getTime() - startDate.getTime();
            progress = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
        }

        const dateStr = target.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

        displayArea.innerHTML = `
            <div class="countdown-main">
                <div class="target-name">
                    <span class="${highlightClass}">${currentTarget.name}</span>
                </div>
                <div class="target-date">📅 ${dateStr}</div>
                <div class="big-number">
                    ${days} <span class="unit">天</span>
                </div>
                <div class="detail-time">
                    ${String(hours).padStart(2, '0')} <span class="sep">时</span>
                    ${String(minutes).padStart(2, '0')} <span class="sep">分</span>
                    ${String(seconds).padStart(2, '0')} <span class="sep">秒</span>
                </div>
                <div class="status ${statusClass}">${statusText}</div>
                <div class="progress-wrap">
                    <div class="bar ${colorClass}" style="width: ${progress.toFixed(1)}%"></div>
                </div>
                <div class="progress-label">已过 ${progress.toFixed(1)}%</div>
            </div>
        `;
    }

    // ================================================================
    //  启动/停止
    // ================================================================
    function startCountdown(name, date) {
        if (!date) { alert('请选择日期'); return; }
        currentTarget = { name: name || '目标', date: date };
        saveToStorage();
        renderCountdown();
        if (timer) clearInterval(timer);
        timer = setInterval(renderCountdown, 1000);
    }

    // ================================================================
    //  事件绑定
    // ================================================================
    document.querySelectorAll('[data-preset]').forEach(btn => {
        btn.addEventListener('click', function() {
            const key = this.dataset.preset;
            if (key === 'custom') {
                targetName.value = '';
                targetDate.value = '';
                targetName.focus();
                return;
            }
            const preset = PRESETS[key];
            if (preset) {
                targetName.value = preset.name;
                targetDate.value = preset.date;
                startCountdown(preset.name, preset.date);
            }
        });
    });

    startBtn.addEventListener('click', function() {
        const name = targetName.value.trim() || '目标';
        const date = targetDate.value;
        if (!date) { alert('请选择日期'); return; }
        startCountdown(name, date);
    });

    resetBtn.addEventListener('click', function() {
        if (confirm('清除当前倒计时？')) {
            currentTarget = null;
            localStorage.removeItem('daodo_countdown');
            if (timer) clearInterval(timer);
            renderCountdown();
            targetName.value = '';
            targetDate.value = '';
        }
    });

    targetDate.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startBtn.click();
    });
    targetName.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') startBtn.click();
    });

    // ================================================================
    //  初始化
    // ================================================================
    const hasSaved = loadFromStorage();
    if (hasSaved && currentTarget) {
        renderCountdown();
        timer = setInterval(renderCountdown, 1000);
    } else {
        // 默认显示中考
        targetName.value = '中考';
        targetDate.value = '2027-06-14';
        startCountdown('中考', '2027-06-14');
    }

    // 加载 Font Awesome
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css';
    document.head.appendChild(link);
</script>

</body>
</html>
