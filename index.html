<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daodo · 独立开发</title>

    <!-- Favicon -->

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== 全局重置 & 暗黑太空背景 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0b0d10;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(10, 30, 60, 0.8) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(60, 20, 80, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(0, 40, 70, 0.6) 0%, transparent 40%);
            color: #e8edf5;
            padding: 20px;
            cursor: default;
            overflow-x: hidden;
        }

        /* ===== 背景粒子层 ===== */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0;
        }
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* ===== 鼠标跟随光晕 ===== */
        .glow {
            position: fixed;
            width: 800px;
            height: 800px;
            top: -400px;
            left: -400px;
            background: radial-gradient(circle, rgba(100, 180, 255, 0.08) 0%, rgba(129, 201, 255, 0.02) 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            transition: transform 0.15s ease-out, opacity 0.3s ease;
            will-change: transform;
        }

        /* ===== 主卡片 ===== */
        .container {
            position: relative;
            z-index: 10;
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            padding: 50px 44px;
            animation: containerIn 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        @keyframes containerIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 模块交错渐入 ===== */
        .header, .hero, .features, .projects-title, .project-card, .footer {
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }
        .header { animation-delay: 0.1s; }
        .hero { animation-delay: 0.2s; }
        .features { animation-delay: 0.3s; }
        .projects-title { animation-delay: 0.4s; }
        .project-card:nth-child(1) { animation-delay: 0.5s; }
        .project-card:nth-child(2) { animation-delay: 0.6s; }
        .project-card:nth-child(3) { animation-delay: 0.7s; }
        .footer { animation-delay: 0.8s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 40px;
            gap: 20px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: transparent;
            box-shadow: none;
            border: none;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .logo-icon:hover {
            transform: rotate(-8deg) scale(1.05);
        }
        .logo-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #a0c4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-text .dot {
            color: #64b5f6;
            -webkit-text-fill-color: #64b5f6;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(100, 200, 150, 0.12);
            border: 1px solid rgba(100, 200, 150, 0.15);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 13px;
            color: #7ee0b0;
            font-weight: 500;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            cursor: default;
        }
        .status-badge:hover {
            background: rgba(100, 200, 150, 0.2);
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.05);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== 核心标语 ===== */
        .hero {
            margin-bottom: 48px;
        }
        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }
        .hero h1 .highlight {
            background: linear-gradient(135deg, #81C9FF, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s infinite alternate;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .hero p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.55);
            max-width: 540px;
            line-height: 1.7;
            font-weight: 300;
            letter-spacing: 0.2px;
        }

        /* ===== 标签 ===== */
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 48px;
        }
        .features span {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
        }
        .features span:hover {
            background: rgba(129, 201, 255, 0.08);
            border-color: rgba(129, 201, 255, 0.15);
            transform: translateY(-2px);
            color: #fff;
        }
        .features span i {
            margin-right: 8px;
            color: #81C9FF;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .features span:hover i {
            opacity: 1;
        }

        /* ===== 项目展示 ===== */
        .projects-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 20px;
            font-weight: 600;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 24px 22px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: default;
            position: relative;
            overflow: hidden;
            transform: perspective(800px) rotateX(0deg) rotateY(0deg);
            will-change: transform;
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(129, 201, 255, 0.04) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        .project-card:hover::before {
            opacity: 1;
        }
        .project-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(129, 201, 255, 0.2);
            transform: perspective(800px) rotateX(2deg) rotateY(4deg) translateY(-6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .project-card .icon {
            display: block;
            margin-bottom: 12px;
            width: 48px;
            height: 48px;
            transition: transform 0.4s ease;
        }
        .project-card:hover .icon {
            transform: scale(1.1) rotate(-4deg);
        }
        .project-card .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .project-card h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
        }
        .project-card p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.6;
        }
        .project-card .tag {
            display: inline-block;
            margin-top: 12px;
            font-size: 11px;
            background: rgba(129, 201, 255, 0.1);
            color: #81C9FF;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(129, 201, 255, 0.05);
            transition: all 0.3s ease;
        }
        .project-card:hover .tag {
            background: rgba(129, 201, 255, 0.2);
            border-color: rgba(129, 201, 255, 0.2);
        }
        .project-card:last-child .tag {
            color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.05);
        }

        /* ===== 底部 ===== */
        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding-top: 28px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .footer .copy {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }
        .footer .copy i {
            color: #f472b6;
            animation: heartbeat 1.8s infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .social-links {
            display: flex;
            gap: 18px;
        }
        .social-links a {
            color: rgba(255, 255, 255, 0.25);
            font-size: 20px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .social-links a:hover {
            color: #81C9FF;
            transform: translateY(-4px) scale(1.1);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 32px 20px;
                border-radius: 32px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .logo-text {
                font-size: 22px;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .hero p {
                font-size: 1rem;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- 背景粒子容器 -->
    <div id="particles"></div>

    <!-- 鼠标光晕 -->
    <div class="glow" id="glow"></div>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="logo-group">
                <div class="logo-icon">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#81C9FF" />
                                <stop offset="100%" stop-color="#A78BFA" />
                            </linearGradient>

                        </defs>

                        <path d="M 45 72 L 28 100 L 45 128" fill="none" stroke="#81C9FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                        <text x="100" y="138" font-family="'Inter', system-ui, sans-serif" font-size="104" font-weight="800" fill="url(#g)" filter="url(#f)" text-anchor="middle" letter-spacing="-2">D</text>
                        <path d="M 155 72 L 172 100 L 155 128" fill="none" stroke="#81C9FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                        <circle cx="172" cy="165" r="6" fill="#A78BFA" opacity="0.7"/>
                    </svg>
                </div>
                <span class="logo-text">Daodo<span class="dot">.</span></span>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                开发中 · 独立厂牌
            </div>
        </div>

        <!-- 英雄区 -->
        <div class="hero">
            <h1>
                创造 · 极简 · <br class="hide-on-desktop" />
                <span class="highlight">独立开发者</span>
            </h1>
            <p>
                一个初三生的数字工坊。不随波逐流，用代码构建有温度的产品。
                目前专注于 Web 全栈开发与极致交互体验。
            </p>
        </div>

        <!-- 技术标签 -->
        <div class="features">
            <span><i class="fas fa-code"></i> 全栈开发</span>
            <span><i class="fas fa-paint-brush"></i> 毛玻璃 UI</span>
            <span><i class="fas fa-cloud-upload-alt"></i> 独立部署</span>
            <span><i class="fas fa-cubes"></i> 单兵作战</span>
        </div>

        <!-- 作品集 -->
        <div class="projects-title"><i class="fas fa-folder-open" style="margin-right: 8px;"></i> 旗下项目</div>
        <div class="projects-grid">

            <!-- ============================================================
                 1. 班级时光机 —— 尖括号 · 书本时钟 放大版
                 ============================================================ -->
            <div class="project-card">
                <span class="icon">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#81C9FF" />
                                <stop offset="100%" stop-color="#A78BFA" />
                            </linearGradient>
                            <filter id="f2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                        </defs>
                        <!-- 毛玻璃底板 -->
                        <rect x="10" y="10" width="180" height="180" rx="40" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

                        <!-- 左尖括号 < -->
                        <path d="M 42 70 L 26 100 L 42 130" fill="none" stroke="#81C9FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

                        <!-- 大书本 -->
                        <path d="M 62 78 Q 82 58 100 78 Q 118 58 138 78 L 138 122 Q 118 102 100 122 Q 82 102 62 122 Z" fill="rgba(255,255,255,0.06)" stroke="url(#g2)" stroke-width="2.5" filter="url(#f2)"/>
                        <!-- 书脊 -->
                        <line x1="100" y1="65" x2="100" y2="135" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

                        <!-- 大时钟（放在书本中央） -->

                        <circle cx="100" cy="100" r="3" fill="url(#g2)"/>

                        <!-- 右尖括号 > -->
                        <path d="M 158 70 L 174 100 L 158 130" fill="none" stroke="#81C9FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

                        <!-- 右下装饰点 -->
                        <circle cx="174" cy="168" r="5" fill="#A78BFA" opacity="0.5"/>

                </span>
                <h3>班级时光机</h3>
                <p>全功能班级社交平台，含动态、群聊、树洞、签到、等级系统及 AI 助手。</p>
                <span class="tag">v3.1.0 · 进行中</span>
            </div>

            <!-- ============================================================
                 2. 记忆星球 —— 方案 B（尖括号 + 同心圆环），透明毛玻璃底板
                 ============================================================ -->
            <div class="project-card">
                <span class="icon">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="gb2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#64b5f6" />
                                <stop offset="100%" stop-color="#7c4dff" />
                            </linearGradient>
                        </defs>
                        <!-- 毛玻璃透明底板（和班级时光机统一） -->

                        <!-- 右尖括号 > -->
                        <path d="M 156 68 L 174 100 L 156 132" fill="none" stroke="#64b5f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />

                        <!-- 同心圆环（抽象星球） -->

                        <circle cx="100" cy="100" r="38" fill="none" stroke="url(#gb2)" stroke-width="2.5" opacity="0.35" />
                        <circle cx="100" cy="100" r="28" fill="url(#gb2)" opacity="0.06" />
                        <circle cx="100" cy="100" r="22" fill="none" stroke="url(#gb2)" stroke-width="1.5" opacity="0.25" />
                        <circle cx="100" cy="100" r="8" fill="url(#gb2)" opacity="0.2" />

                        <!-- 光照阴影 -->
                        <path d="M 100 54 A 38 38 0 0 1 136 90 A 38 38 0 0 0 100 62 Z" fill="rgba(255,255,255,0.04)" />

                        <!-- 右下装饰点 -->
                        <circle cx="174" cy="168" r="5" fill="#7c4dff" opacity="0.3" />
                    </svg>
                </span>
                <h3>记忆星球</h3>
                <p>将你的记忆化作一颗颗独特的星球，在宇宙中永恒闪耀。3D 交互、情绪颜色、时光轴。</p>
                <span class="tag">v5.1 · 已上线</span>
            </div>

            <!-- ============================================================
                 3. 下一个产品（占位）
                 ============================================================ -->
            <div class="project-card" style="opacity: 0.6; border-style: dashed;">
                <span class="icon">🚀</span>
                <h3>下一个产品</h3>
                <p>正在构想中… 保持神秘，敬请期待。</p>
                <span class="tag" style="color: rgba(255,255,255,0.3);">规划中</span>
            </div>

        </div>

        <!-- 底部 -->
        <div class="footer">
            <div class="copy">
                © 2026 Daodo · Made with <i class="fas fa-heart" style="color: #f472b6; font-size: 12px;"></i>
            </div>
            <div class="social-links">

    <script>
        // ============================================================
        //  ✨ 背景粒子系统
        // ============================================================
        (function() {
            const container = document.getElementById('particles');
            const count = 40;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = 2 + Math.random() * 4;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (10 + Math.random() * 20) + 's';
                particle.style.animationDelay = (Math.random() * 20) + 's';
                particle.style.opacity = 0.2 + Math.random() * 0.3;
                container.appendChild(particle);
            }
        })();

        // ============================================================
        //  🖱️ 鼠标光晕
        // ============================================================
        const glow = document.getElementById('glow');
        let targetX = window.innerWidth / 2;
        let targetY = window.innerHeight / 2;
        let currentX = targetX;
        let currentY = targetY;

        document.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
        });

        function smoothGlow() {
            currentX += (targetX - currentX) * 0.08;
            currentY += (targetY - currentY) * 0.08;
            glow.style.transform = `translate(${currentX}px, ${currentY}px)`;
            requestAnimationFrame(smoothGlow);
        }
        smoothGlow();

        // ============================================================
        //  🎴 卡片 3D 倾斜效果
        // ============================================================
        const cards = document.querySelectorAll('.project-card');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                card.style.setProperty('--mouse-x', (x * 100 + 50) + '%');
                card.style.setProperty('--mouse-y', (y * 100 + 50) + '%');
                card.style.transform = `
                    perspective(800px)
                    rotateX(${-y * 6}deg)
                    rotateY(${x * 6}deg)
                    translateY(-6px)
                `;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0)';
            });
        });

        console.log('Daodo 官网已升级 ✨ 欢迎来到独立开发者的世界！');
    </script>
